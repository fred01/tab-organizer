<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Full-bleed rounded badge so the icon reads on any theme (no transparent corners showing through) -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#3D6FE0"/>

  <!-- Browser window body -->
  <rect x="22" y="46" width="84" height="56" rx="9" fill="#FFFFFF"/>

  <!-- Tabs on top: two muted + one active accent tab -->
  <rect x="22" y="32" width="26" height="20" rx="6" fill="#FFFFFF" opacity="0.55"/>
  <rect x="80" y="32" width="26" height="20" rx="6" fill="#FFFFFF" opacity="0.55"/>
  <rect x="50" y="26" width="28" height="26" rx="6" fill="#FFD166"/>

  <!-- Content lines inside the window -->
  <g fill="#3461C9" opacity="0.35">
    <rect x="34" y="62" width="60" height="7" rx="3.5"/>
    <rect x="34" y="76" width="60" height="7" rx="3.5"/>
    <rect x="34" y="90" width="40" height="7" rx="3.5"/>
  </g>
</svg>
